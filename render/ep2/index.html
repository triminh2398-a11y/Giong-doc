, 1425.45, "“Nhìn bàn tay nó đi má!”", "H"], [1425.45, 1427.79, "“Má nhìn cái vai của anh Lợi đi!”", "H"], [1428.6, 1429.87, "Bà Tư nhìn đứa nhỏ.", "N"], [1429.87, 1431.45, "Đứa nhỏ cũng nhìn lại bà,", "N"], [1431.45, 1432.51, "không chớp mắt.", "N"], [1432.51, 1433.83, "Rồi bà Tư sụp xuống,", "N"], [1433.83, 1434.99, "ôm lấy chân Hiền.", "N"], [1435.75, 1436.57, "“Má có tội!”", "BT"], [1436.57, 1437.5, "“Má có tội...”", "BT"], [1437.5, 1438.38, "“với má con,”", "BT"], [1438.38, 1439.64, "“với anh hai con...”", "BT"], [1440.4, 1442.12, "“Mà má sợ quá con ơi...”", "BT"], [1442.12, 1443.72, "“má mất ba đứa rồi...”", "BT"], [1443.72, 1445.83, "“má hổng muốn mất đứa thứ tư!”", "BT"], [1446.59, 1448.02, "“Ông thầy nói...”", "BT"], [1448.02, 1450.89, "“đổi mạng thì phải giữ kín suốt đời.”", "BT"], [1450.89, 1452.97, "“Ngày nào bí mật lộ ra...”", "BT"], [1452.97, 1454.83, "“nợ sẽ đòi lại gấp ba.”", "BT"], [1455.59, 1456.98, "Lợi đứng sau lưng,", "N"], [1456.98, 1459.04, "nghe hết. Anh dựa vô cột nhà,", "N"], [1459.04, 1460.01, "ho sặc sụa,", "N"], [1460.01, 1461.11, "ho ra cả máu.", "N"], [1461.92, 1463.45, "Đêm đó, Lợi nằm trên võng,", "N"], [1463.45, 1464.64, "người nóng như lửa.", "N"], [1464.64, 1465.73, "Hiền ngồi kế bên,", "N"], [1465.73, 1466.72, "quạt cho chồng.", "N"], [1467.18, 1468.12, "Gần nửa đêm,", "N"], [1468.12, 1469.29, "Lợi bỗng mở mắt,", "N"], [1469.29, 1470.29, "ngồi bật dậy,", "N"], [1470.29, 1471.84, "nhìn ra hướng bến sông.", "N"], [1472.3, 1474.42, "“Anh Lợi ơi...”", "GH"], [1474.42, 1478.07, "“xuống đây với em nè anh...”", "GH"], [1478.07, 1480.42, "“nước mát lắm...”", "GH"], [1481.53, 1483.93, "“Hiền... em kêu anh hả?”", "L"], [1483.93, 1485.79, "“Em ra bến chi...”", "L"], [1485.79, 1487.3, "“giờ này vậy?”", "L"], [1488.06, 1490.08, "“Anh Lợi! Em ở đây nè!”", "H"], [1490.08, 1492.18, "“Em ngồi kế bên anh nè!”", "H"], [1492.18, 1493.5, "“Anh đừng đi!”", "H"], [1494.31, 1496.01, "Nhưng Lợi như người mộng du,", "N"], [1496.01, 1496.99, "gạt tay vợ ra m cái bóng nhỏ nhào tới,", "N"], [1642.77, 1643.95, "ôm chầm lấy bà Tư.", "N"], [1644.76, 1646.21, "Hiền đứng sau gốc dừa,", "N"], [1646.21, 1647.55, "bịt chặt miệng mình.", "N"], [1647.55, 1649.59, "Đứa con trong tay cô vẫn ngủ say,", "N"], [1649.59, 1650.66, "không động đậy.", "N"], [1651.12, 1652.6, "Tiếng bà Tư không la,", "N"], [1652.6, 1654.77, "không khóc. Chỉ có tiếng thở dốc,", "N"], [1654.77, 1655.74, "rồi tắt dần,", "N"], [1655.74, 1657.33, "giữa tiếng tre kẽo kẹt.", "N"], [1658.14, 1660.27, "Sáng ra, người ta thấy bà Tư nằm ngửa", "N"], [1660.27, 1661.54, "giữa năm nấm mộ nhỏ,", "N"], [1661.54, 1662.35, "hai mắt mở,", "N"], [1662.35, 1663.36, "miệng mỉm cười.", "N"], [1663.82, 1665.15, "Trên vai trái bà,", "N"], [1665.15, 1667.5, "có một dấu chữ thập màu xanh chàm,", "N"], [1667.5, 1669.49, "như ai mới rạch lên đêm qua.", "N"], [1669.95, 1671.14, "Cùng buổi sáng đó,", "N"], [1671.14, 1672.33, "Lợi ngồi dậy được,", "N"], [1672.33, 1673.57, "ăn hết một tô cháo.", "N"], [1673.57, 1675.39, "Vết bầm trên vai anh biến mất.", "N"], [1676.2, 1677.32, "Thầy Bảy tới,", "N"], [1677.32, 1678.58, "nhìn xác bà Tư,", "N"], [1678.58, 1680.39, "rồi chắp tay vái ba vái.", "N"], [1680.85, 1681.78, "“Nợ trả rồi.”", "TH"], [1681.78, 1683.18, "“Từ nay nhà này yên.”", "TH"], [1683.18, 1684.11, "“Đứa nhỏ đó,”", "TH"], [1684.11, 1686.26, "“cô Hiền ráng nuôi cho nên người.”", "TH"], [1687.07, 1689.37, "Đứa con thứ ba của Hiền sống qua tháng", "N"], [1689.37, 1691.14, "thứ năm, rồi tháng thứ mười,", "N"], [1691.14, 1692.37, "rồi tròn một tuổi.", "N"], [1692.83, 1694.74, "Hiền đặt tên nó là thằng Trả.", "N"], [1694.74, 1696.19, "Nó lớn lên khỏe mạnh,", "N"], [1696.19, 1698.6, "lanh lợi, chỉ có bàn tay trái là thiếu", "N"], [1698.6, 1699.55, "một ngón út.", "N"], [1700.01, 1701.89, "Cả xóm Rạch Mây ai cũng nói,", "N"], [1701.89, 1704.23, "nhà bà Tư Lài cuối cùng cũng hết nợ.", "N"], [1704.69, 1705.71, "Lợi lành bệnh,", "N"], [1705.71, 1706.8, "trở lại làm ăn.", "N"], [1706.8, 1708.6
