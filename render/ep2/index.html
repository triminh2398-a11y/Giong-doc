, "hai mắt mở,", "N"], [1560.7, 1561.71, "miệng mỉm cười.", "N"], [1562.17, 1563.5, "Trên vai trái bà,", "N"], [1563.5, 1565.85, "có một dấu chữ thập màu xanh chàm,", "N"], [1565.85, 1567.83, "như ai mới rạch lên đêm qua.", "N"], [1568.29, 1569.48, "Cùng buổi sáng đó,", "N"], [1569.48, 1570.68, "Lợi ngồi dậy được,", "N"], [1570.68, 1571.92, "ăn hết một tô cháo.", "N"], [1571.92, 1573.73, "Vết bầm trên vai anh biến mất.", "N"], [1574.54, 1575.67, "Thầy Bảy tới,", "N"], [1575.67, 1576.92, "nhìn xác bà Tư,", "N"], [1576.92, 1578.74, "rồi chắp tay vái ba vái.", "N"], [1579.2, 1580.13, "“Nợ trả rồi.”", "TH"], [1580.13, 1581.53, "“Từ nay nhà này yên.”", "TH"], [1581.53, 1582.46, "“Đứa nhỏ đó,”", "TH"], [1582.46, 1584.61, "“cô Hiền ráng nuôi cho nên người.”", "TH"], [1585.42, 1587.72, "Đứa con thứ ba của Hiền sống qua tháng", "N"], [1587.72, 1589.49, "thứ năm, rồi tháng thứ mười,", "N"], [1589.49, 1590.72, "rồi tròn một tuổi.", "N"], [1591.18, 1593.08, "Hiền đặt tên nó là thằng Trả.", "N"], [1593.08, 1594.54, "Nó lớn lên khỏe mạnh,", "N"], [1594.54, 1596.94, "lanh lợi, chỉ có bàn tay trái là thiếu", "N"], [1596.94, 1597.9, "một ngón út.", "N"], [1598.36, 1600.24, "Cả xóm Rạch Mây ai cũng nói,", "N"], [1600.24, 1602.57, "nhà bà Tư Lài cuối cùng cũng hết nợ.", "N"], [1603.03, 1604.06, "Lợi lành bệnh,", "N"], [1604.06, 1605.14, "trở lại làm ăn.", "N"], [1605.14, 1606.98, "Hai vợ chồng sửa lại bàn thờ,", "N"], [1606.98, 1608.82, "thờ thêm bát nhang cho bà Tư,", "N"], [1608.82, 1610.23, "và năm bát nhang nhỏ.", "N"], [1611.04, 1612.74, "Năm thằng Trả lên năm tuổi,", "N"], [1612.74, 1613.59, "có một đêm,", "N"], [1613.59, 1616.03, "Hiền thấy nó ngồi một mình trước bàn thờ,", "N"], [1616.03, 1617.41, "nói chuyện với ai đó.", "N"], [1617.87, 1621.08, "“Trả, con nói chuyện với ai vậy con?”", "H"], [1621.54, 1623.35, "“Con nói chuyện với bà nội.”", "BE"], [1623.35, 1624.99, "“Bà nội kêu con nhắc má,”", "BE"], [1624.99, 1627.27, "“rằm này nhớ đốt nhang cho mấy anh.”", "BE"], [1627.73
