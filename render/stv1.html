SH.tip_knife=(lt,D,TT,ls)=>SH.tip(lt,D,TT,ls,'',2,()=>{knife(820,520,1.8,-0.1);ctx.globalAlpha=0.5+0.5*Math.sin(TT*6);ctx.fillStyle='#fff';star(1450,470,40);ctx.globalAlpha=1;T('Càng sắc càng ít khí',1100,840,60,INK,{stroke:10})});
SH.tip_root=(lt,D,TT,ls)=>SH.tip(lt,D,TT,ls,'',3,()=>{onion(1100,520,1.2,TT,{});ctx.strokeStyle=CORAL;ctx.lineWidth=10;ctx.setLineDash([20,14]);C(1100,720,90,null,0);ctx.beginPath();ctx.arc(1100,720,90,0,7);ctx.stroke();ctx.setLineDash([]);T('Cắt gốc sau cùng',1100,920,60,INK,{stroke:10})});
SH.tip_fan=(lt,D,TT,ls)=>SH.tip(lt,D,TT,ls,'',4,()=>{fan(1300,480,1.2,TT);gasCloud(800-((lt*200)%300),520,0.8,TT,0.8)});
SH.tip_goggles=(lt,D,TT,ls)=>SH.tip(lt,D,TT,ls,'',5,()=>{bin(1100,600,1.6,TT,{em:'happy',talk:true});goggles(1100,566+Math.sin(TT*2.5)*8,0.62)});
SH.myth=(lt,D,TT)=>{panel('#f1f3f5',TT);bread(640,520,1.4);glass(1280,520,1.5);const k=pop(lt,0.8);ctx.save();ctx.translate(960,300);ctx.scale(k,k);RR(-300,-70,600,140,30,CORAL,7);T('CHƯA CÓ BẰNG CHỨNG',0,4,46,'#fff');ctx.restore()};
SH.outro=(lt,D,TT,ls)=>{panel(TEAL,TT);bin(560,640,1.6,TT,{talk:true,wave:true});if(lt>L_(ls,1,99)){const k=pop(lt,L_(ls,1,99));ctx.save();ctx.translate(1300,500);ctx.scale(k,k);RR(-280,-70,560,140,70,'#ff0000',0);T('ĐĂNG KÝ',0,4,64,'#fff');ctx.restore()}else onion(1350,560,1.0,TT,{face:true,look:-1})};
SH.end=(lt,D,TT)=>{panel(YEL,TT,'stripes');const k=pop(lt,0.1,0.5);ctx.save();ctx.translate(W/2,H/2-60);ctx.scale(k,k);RR(-560,-110,1120,220,50,'#fff',8);T('SỰ THẬT THÚ VỊ',0,6,96,INK);ctx.restore();bin(W/2,860,0.9,TT,{wave:true})};
// ---------- frame ----------
function subs(TT){for(const [a,b,s] of TL.subs){if(TT<a||TT>b)continue;ctx.save();const al=Math.min(sm((TT-a)/0.1),sm((b-TT)/0.1));ctx.globalAlpha=al;ctx.font='bold 44px "DejaVu Sans"';ctx.textAlign='center';ctx.lineJoin='round';ctx.lineWidth=10;ctx.strokeStyle=INK;ctx.strokeText(s,W/2,1030);ctx.fillStyle='#fff';ctx.fillText(s,W/2,1030);ctx.restore()}}
function draw(TT){ctx.setTransform(1,0,0,1,0,0);let cur=null,prev=null;for(let i=0;i<TL.scenes.length;i++){const sc=TL.scenes[i];if(TT>=sc[1]&&TT<sc[2]){cur=sc;prev=TL.scenes[i-1];break}}
 if(cur){const lt=TT-cur[1];const k=sm(seg(lt,0,0.35));ctx.save();if(k<1){ctx.translate((1-k)*W*0.25,0);}const [nm,a,b,ls,txt]=cur;const f=SH[nm];if(f)f(lt,b-a,TT,ls,txt);ctx.restore();
  if(k<1&&prev){ctx.save();ctx.fillStyle=INK;ctx.globalAlpha=0.0;ctx.restore();ctx.save();ctx.fillStyle=YEL;ctx.fillRect(lerp(-80,W,k)-80,0,80,H);ctx.restore()}}
 // progress bar
 ctx.fillStyle='rgba(31,34,53,.25)';ctx.fillRect(0,0,W,10);ctx.fillStyle=CORAL;ctx.fillRect(0,0,W*TT/TL.dur,10);
 subs(TT);let fa=1-sm(seg(TT,0,0.3));fa=Math.max(fa,sm(seg(TT,TL.dur-0.6,TL.dur)));if(fa>0){ctx.fillStyle=`rgba(0,0,0,${fa})`;ctx.fillRect(0,0,W,H)}}
window.draw=draw;window.DURATION=TL.dur;

</script></body></html>
