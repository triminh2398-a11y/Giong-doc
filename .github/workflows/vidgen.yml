name: tao-video
on:
  push:
    paths: ['vidgen/job.json']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  gen:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix: { shard: [0,1] }
    steps:
      - uses: actions/checkout@v4
        with: { sparse-checkout: vidgen }
      - name: Swap
        run: sudo fallocate -l 12G /swapx && sudo chmod 600 /swapx && sudo mkswap /swapx && sudo swapon /swapx && free -g
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - uses: actions/cache@v4
        with: { path: ~/.cache/huggingface, key: hf-ltx-video-v1 }
      - run: pip install -q --index-url https://download.pytorch.org/whl/cpu torch==2.5.1 && pip install -q diffusers==0.32.2 transformers==4.47.1 accelerate==1.2.1 sentencepiece imageio imageio-ffmpeg
        timeout-minutes: 15
      - run: python vidgen/gen.py 2>&1 | tee vidgen/log_${{ matrix.shard }}.txt
        timeout-minutes: 320
        env: { SHARD: '${{ matrix.shard }}', NSHARD: '2' }
      - name: Push
        if: always()
        run: |
          git config user.name bot; git config user.email bot@users.noreply.github.com
          mkdir -p vidgen/logs; cp vidgen/log_*.txt vidgen/logs/ 2>/dev/null || true
          git add vidgen/out vidgen/logs; git commit -qm "video shard ${{ matrix.shard }}" || true
          for k in 1 2 3 4 5 6 7 8; do git pull -q --rebase && git push -q && break; sleep $((RANDOM % 10 + 3)); done
