name: tao-giong
on:
  push:
    paths: ['jobs/**']
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: tts, cancel-in-progress: false }
jobs:
  tts:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Cache models
        uses: actions/cache@v4
        with: { path: ~/.cache/huggingface, key: hf-vieneu-v3 }
      - run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
      - run: pip install -q vieneu
      - run: python tts.py
      - name: Commit audio
        run: |
          git config user.name "tao-giong-bot"
          git config user.email "bot@users.noreply.github.com"
          git add out
          git commit -m "Giong doc moi" || echo "nothing to commit"
          git pull --rebase -q || true
          git push
