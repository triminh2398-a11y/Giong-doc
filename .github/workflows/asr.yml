name: nhan-dang-giong
on:
  push:
    paths: ['asr/in/**']
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: asr, cancel-in-progress: false }
jobs:
  asr:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - uses: actions/cache@v4
        with: { path: ~/.cache/huggingface, key: hf-whisper-medium }
      - run: pip install -q faster-whisper
      - run: python asr/run.py
      - run: |
          git config user.name "asr-bot"; git config user.email "bot@users.noreply.github.com"
          git add asr/out; git commit -m "ASR ket qua" || echo none
          for i in 1 2 3 4 5; do git pull --rebase -q && git push && break; sleep 7; done
