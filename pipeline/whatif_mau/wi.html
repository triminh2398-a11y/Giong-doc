const cl=(x,a=0,b=1)=>Math.max(a,Math.min(b,x)),sm=x=>{x=cl(x);return x*x*(3-2*x)},seg=(t,a,b)=>cl((t-a)/(b-a)),lerp=(a,b,k)=>a+(b-a)*k;
function rnd(i){const x=Math.sin(i*127.1+311.7)*43758.5453;return x-Math.floor(x)}

function vnoise(x,y,per){const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi;const w=(a)=>((a%per)+per)%per;const u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);
 const a=hash(w(xi),yi),b=hash(w(xi+1),yi),c=hash(w(xi),yi+1),d=hash(w(xi+1),yi+1);return lerp(lerp(a,b,u),lerp(c,d,u),v)}
function fbm(x,y,per){let s=0,a=0.5,f=1;for(let i=0;i<6;i++){s+=a*vnoise(x*f,y*f,per*f);a*=0.5;f*=2}return s}

function earthTex(){const w=1024,h=512,c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d');const im=g.createImageData(w,h);
 for(let y=0;y<h;y++)for(let x=0;x<w;x++){const lat=Math.abs(y/h-0.5)*2;const n=fbm(x/w*6,y/h*3+0.3,6);const land=n-0.08*Math.cos(lat*3)>0.53;let r,gg,b;

  const i=(y*w+x)*4;im.data[i]=r;im.data[i+1]=gg;im.data[i+2]=b;im.data[i+3]=255}

{const n=1600,p=new Float32Array(n*3);for(let i=0;i<n;i++){const u=rnd(i)*2-1,th=rnd(i+9)*Math.PI*2,r=80;p[i*3]=r*Math.sqrt(1-u*u)*Math.cos(th);p[i*3+1]=r*u;p[i*3+2]=r*Math.sqrt(1-u*u)*Math.sin(th)}

{const lat=16*Math.PI/180,lon=0.9;const v=new THREE.Vector3(Math.cos(lat)*Math.cos(lon),Math.sin(lat),-Math.cos(lat)*Math.sin(lon)).multiplyScalar(3.0);pin.position.copy(v);pin.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),v.clone().normalize());earth.add(pin)}

const flyers=[];

function house(col,roof,w=3,h=2.4,d=3){const gr=new THREE.Group();const b=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),M({color:col}));b.position.y=h/2;const r=new THREE.Mesh(new THREE.ConeGeometry(w*0.82,1.5,4),M({color:roof}));r.position.y=h+0.75;r.rotation.y=Math.PI/4;
 const door=new THREE.Mesh(new THREE.BoxGeometry(0.7,1.2,0.05),M({color:0x6b4a2e}));door.position.set(0,0.6,d/2+0.02);const win=new THREE.Mesh(new THREE.BoxGeometry(0.6,0.5,0.05),M({color:0xbfe6ff,emissive:0x223344}));win.position.set(w*0.28,1.5,d/2+0.02);const win2=win.clone();win2.position.x=-w*0.28;gr.add(b,r,door,win,win2);return gr}

 for(const [x,z] of [[-0.7,0.55],[0.7,0.55],[-0.7,-0.55],[0.7,-0.55]]){const w=new THREE.Mesh(new THREE.CylinderGeometry(0.25,0.25,0.15,14),M({color:0x222222}));w.rotation.x=Math.PI/2;w.position.set(x,0.25,z);gr.add(w)}return gr}

 if(wave>0){const front=lerp(60,-52,wave);const d=z-front;y+=Math.exp(-d*d/50)*14*sm(wave*3)+(d>0?Math.exp(-d/18)*2*sm(wave*3):0)}p[i+1]=y;const cc=seaGeo.attributes.color.array,f=cl((y-6)/7);cc[i]=lerp(0.015,0.95,f);cc[i+1]=lerp(0.12,0.97,f);cc[i+2]=lerp(0.3,1,f)}seaGeo.attributes.position.needsUpdate=true;seaGeo.attributes.color.needsUpdate=true;seaGeo.computeVertexNormals()}

function T2(s,x,y,size,col,a=1,o={}){g2.save();g2.globalAlpha=a;g2.font=`${o.w||'900'} ${size}px ${o.f||'"DejaVu Sans"'}`;g2.textAlign=o.al||'center';g2.lineJoin='round';if(o.st!==0){g2.lineWidth=o.st||size*0.16;g2.strokeStyle=o.sc||'rgba(10,14,30,.95)';g2.strokeText(s,x,y)}g2.fillStyle=col;g2.fillText(s,x,y);g2.restore()}

function subs(t){for(const [a,b,s] of TL.subs){if(t<a||t>=b)continue;const al=Math.min(sm((t-a)/0.12),sm((b-t)/0.12));const L=wrap(s,1500,'bold 52px "DejaVu Sans"');L.forEach((l,i)=>T2(l,W/2,980-(L.length-1-i)*66,52,'#ffffff',al,{w:'bold',st:11,sc:'#000'}))}}
