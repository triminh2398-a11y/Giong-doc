{ const t = new THREE.Mesh(new THREE.PlaneGeometry(1.1, 1.1), taleoM); t.position.set(0, 3.95, 0); t.castShadow = true; GATE.add(t); const st = new THREE.Mesh(new THREE.CylinderGeometry(.03, .03, .7, 6), gpM); st.position.set(0, 3.5, 0); GATE.add(st); }

{ const pts = []; for (let k = 0; k <= 20; k++) { const u = k / 20; pts.push(new THREE.Vector3(lerp(-1.9, 1.9, u), 1.15 - Math.sin(u * Math.PI) * .18, .05)); } const rope = new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts), 40, .018, 6), M({ color: 0x9a8058 })); rope.castShadow = true; GATE.add(rope);
